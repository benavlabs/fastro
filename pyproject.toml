[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastro"
version = "0.1.0.dev0"
description = "Generate Fastro projects from a blueprint, keep them in sync, and check them."
authors = [{ name = "Benav Labs", email = "contact@benav.io" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "packaging>=26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pyyaml>=6.0.2",
    "ruff==0.15.12",
    "mypy>=1.14.1",
    "hatchling>=1.27",
    "types-PyYAML>=6.0",
    "coverage>=7.6",
    "hypothesis>=6.100",
]

[project.scripts]
fastro = "fastro.cli:app"
bp = "fastro.compat:bp_main"

[tool.hatch.build.targets.wheel]
packages = ["src/fastro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 128
extend-exclude = ["tests/fixtures/drill/*/backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
extend-select = ["UP006", "UP007", "UP035", "UP039", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["fastro"]

[tool.mypy]
python_version = "3.11"
exclude = ["^tests/fixtures/drill/[^/]+/"]
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
