name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv venv --python ${{ matrix.python }} .venv
      - run: uv pip install --python .venv/bin/python -e '.[dev]'
      - run: .venv/bin/python -m ruff check src tests
      - run: .venv/bin/python -m ruff format --check src tests
      - run: .venv/bin/python -m mypy --strict src tests
      - run: .venv/bin/python -m pytest -q
