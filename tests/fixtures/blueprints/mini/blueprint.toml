[blueprint]
name = "mini"
version = "0.1.0"
schema = 1
requires_fastro = ">=0.1.0.dev0"

[presets]
minimal = ["accounts"]
full = ["accounts", "billing", "cache", "tasks", "admin"]

[verify.sets]
queues = ["tasks", "cache"]

[[verify.checks]]
name = "smoke"
run = ["python", "-c", "pass"]
if = "tasks"

[points.routers]
cardinality = "many"
doc = "The app's routers, each mounted at a prefix."

[points.email_sender]
cardinality = "one"
doc = "How the app sends an email."

[points.settings]
cardinality = "many"
doc = "The bases of the app's settings class."

[points.task_modules]
cardinality = "many"
doc = "The modules that hold background tasks."

[points.health_checks]
cardinality = "many"
doc = "Checks the readiness probe runs."

[points.menu]
cardinality = "many"
doc = "Entries in the frontend's menu."

[points.admin_site]
cardinality = "one"
doc = "The admin site the app mounts."

[core.contributes]
health_checks = ["src.health:database"]

[features.accounts]
summary = "Users and login"
group = "Identity"
paths = ["backend/src/modules/accounts/", "backend/tests/test_accounts.py"]

[features.accounts.contributes]
routers = [{ ref = "src.modules.accounts.routes:router as accounts_router", prefix = "/accounts" }]
email_sender = [{ ref = "src.modules.accounts.email:send_now", if = "not tasks" }]

[[features.accounts.when]]
if = "tasks"
contributes = { email_sender = ["src.modules.accounts.email:send_queued"] }

[features.billing]
summary = "Payments"
requires = ["accounts"]
paths = ["backend/src/modules/billing/", "backend/tests/test_billing.py"]

[features.billing.options.provider]
choices = ["stripe", "paddle"]
default = "stripe"

[features.billing.contributes]
routers = [{ ref = "src.modules.billing.routes:router as billing_router", prefix = "/billing", order = 50 }]

[[features.billing.when]]
if = "billing.provider=paddle"
paths = ["backend/src/modules/billing/paddle.py"]

[features.cache]
summary = "A cache for slow reads"
paths = ["backend/src/modules/cache/", "backend/tests/test_cache.py"]

[features.cache.options.backend]
choices = ["memory", "redis"]
default = "memory"

[features.cache.contributes]
settings = ["src.modules.cache.settings:CacheSettings"]

[[features.cache.when]]
if = "cache.backend=redis"
services = ["redis"]

[features.tasks]
summary = "Background tasks"
paths = ["backend/src/modules/tasks/", "backend/tests/test_tasks.py"]

[features.tasks.contributes]
task_modules = ["src.modules.tasks.jobs"]

[features.admin]
summary = "An admin site"
group = "Operations"
requires = ["accounts"]
paths = ["backend/src/modules/admin/", "backend/tests/test_admin.py"]

[features.admin.contributes]
admin_site = ["src.modules.admin.site:site"]
menu = [{ data = { href = "/admin", label = "Admin" } }]

[wiring_defaults]
header = """
Generated by fastro from blueprint.toml and fastro.toml. Don't edit: change
fastro.toml (or [app] in it, for your own code) and run `fastro sync`.
"""

[[wiring]]
path = "backend/src/wiring/app.py"
doc = "The app's routers, email sender and settings."
imports = ["from collections.abc import Callable"]

[[wiring.slots]]
kind = "tuple"
name = "ROUTERS"
point = "routers"
annotation = "tuple[Mount, ...]"
item = 'Mount({name}, "{prefix}")'
item_imports = ["from ..mount import Mount"]

[[wiring.slots]]
kind = "value"
name = "EMAIL_SENDER"
point = "email_sender"
annotation = "Callable[[str], None]"
fallback = "send_nowhere"
fallback_imports = ["from ..email import send_nowhere"]

[[wiring.slots]]
kind = "class"
name = "Settings"
point = "settings"
doc = "The app's settings."

[[wiring.slots]]
kind = "raw"
code = '__all__ = ["EMAIL_SENDER", "ROUTERS", "Settings"]'

[[wiring]]
path = "backend/src/wiring/tasks.py"
doc = "The modules that hold background tasks."

[[wiring.slots]]
kind = "list"
name = "TASK_MODULES"
point = "task_modules"
annotation = "list[str]"
literal = true

[[wiring]]
path = "backend/src/wiring/health.py"
doc = "The checks the readiness probe runs."
imports = ["from collections.abc import Callable"]

[[wiring.slots]]
kind = "list"
name = "HEALTH_CHECKS"
point = "health_checks"
annotation = "list[Callable[[], bool]]"

[[wiring]]
path = "backend/src/wiring/admin.py"
doc = "The admin site the app mounts."

[[wiring.slots]]
kind = "reexport"
name = "SITE"
point = "admin_site"
fallback = "src.admin_default:site"

[[wiring]]
path = "frontend/menu.ts"
doc = "The frontend's menu."
if = "admin"

[[wiring.slots]]
kind = "data"
name = "MENU"
point = "menu"
format = "ts"
